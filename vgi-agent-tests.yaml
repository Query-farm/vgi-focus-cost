# Private graders for the public vgi.agent_test_tasks in the worker's catalog metadata.
# `vgi-lint lint --ai` runs an agent on each prompt and grades it with reference_sql/check_sql.
# Every task reads the bundled sample:// exports or the reference tables, so it is deterministic.
# See https://github.com/Query-farm/vgi-lint-check (VGI920).
tasks:
  - name: aws_effective_by_category
    reference_sql: >-
      SELECT ChargeCategory, sum(EffectiveCost) AS effective_cost
      FROM focus.main.focus('sample://aws_cur2', billing_period := '2026-07')
      GROUP BY ChargeCategory ORDER BY ChargeCategory
  - name: azure_amortized_by_service_category
    reference_sql: >-
      SELECT ServiceCategory, sum(EffectiveCost) AS effective_cost
      FROM focus.main.focus('sample://azure/contoso-amortized-cost-202607.parquet', source := 'azure_amortized')
      GROUP BY ServiceCategory ORDER BY ServiceCategory
  - name: validate_focus12_as_1_3
    reference_sql: >-
      SELECT check_name, column_name, status
      FROM focus.main.focus_validate('sample://focus12', spec_version := '1.3')
      WHERE status <> 'pass' ORDER BY check_name, column_name
  - name: map_one_cur_row
    reference_sql: >-
      SELECT BilledCost, EffectiveCost, CommitmentDiscountType FROM focus.main.to_focus((
        SELECT 'DiscountedUsage' AS line_item_line_item_type, 0 AS line_item_unblended_cost,
               4.1088 AS reservation_effective_cost, 'arn:aws:rds:us-east-1:1:ri:x' AS reservation_reservation_a_r_n))
  - name: mandatory_columns_1_2
    reference_sql: >-
      SELECT count(*) AS mandatory FROM focus.main.focus_columns
      WHERE spec_version = '1.2' AND feature_level = 'Mandatory'
  - name: aws_effective_cost_inputs
    reference_sql: >-
      SELECT unnest(source_columns) AS source_column FROM focus.main.provider_map
      WHERE source = 'aws_cur2' AND focus_column = 'EffectiveCost' ORDER BY source_column
  - name: azure_database_services
    reference_sql: >-
      SELECT count(*) AS services FROM focus.main.service_map
      WHERE provider = 'azure' AND service_category = 'Databases'
  - name: aws_credit_line_items
    reference_sql: >-
      SELECT charge_type FROM focus.main.charge_type_map
      WHERE source = 'aws_cur2' AND charge_category = 'Credit' ORDER BY charge_type
  - name: rds_category
    reference_sql: >-
      SELECT focus.main.focus_service_category('aws', 'AmazonRDS') AS category,
             focus.main.focus_service_subcategory('aws', 'AmazonRDS') AS subcategory
  - name: unused_reservation_category
    reference_sql: SELECT focus.main.focus_charge_category('azure', 'UnusedReservation') AS charge_category
  - name: gcp_list_cost_lineage
    reference_sql: SELECT focus.main.focus_map_column('gcp', 'cost_at_list') AS focus_columns
  - name: validate_charge_frequency
    reference_sql: SELECT focus.main.focus_validate_value('ChargeFrequency', 'Usage-based') AS problem
  - name: exact_ratio
    reference_sql: SELECT focus.main.focus_divide(10, 3) AS ratio
  - name: sp_effective_rate
    reference_sql: >-
      SELECT focus.main.focus_effective_rate(sum(EffectiveCost), sum(PricingQuantity)) AS hourly_rate
      FROM focus.main.focus('sample://aws_cur2', billing_period := '2026-07')
      WHERE x_ChargeType = 'SavingsPlanCoveredUsage'
