# Private graders for the public vgi.agent_test_tasks in the worker's catalog metadata.
# `vgi-lint lint --ai` runs an agent on each prompt and grades it with reference_sql/check_sql.
# See https://github.com/Query-farm/vgi-lint-check (VGI920).
tasks:
  - name: aws_effective_cost_inputs
    reference_sql: >-
      SELECT unnest(source_columns) AS source_column FROM focus.main.provider_map
      WHERE source = 'aws_cur2' AND focus_column = 'EffectiveCost' ORDER BY source_column
  - name: ec2_category
    reference_sql: >-
      SELECT focus.main.focus_service_category('aws', 'AmazonRDS') AS category,
             focus.main.focus_service_subcategory('aws', 'AmazonRDS') AS subcategory
  - name: mandatory_columns_1_2
    reference_sql: >-
      SELECT count(*) AS mandatory FROM focus.main.focus_columns
      WHERE spec_version = '1.2' AND feature_level = 'Mandatory'
  - name: exact_ratio
    reference_sql: SELECT focus.main.focus_divide(10, 3) AS ratio
